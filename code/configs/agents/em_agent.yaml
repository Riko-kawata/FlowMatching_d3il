_target_: agents.em_agent.EMAgent
_recursive_: false

model:
  _target_: agents.models.em.em_policy.EMStatePolicy
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  obs_history: ${agents.obs_history}
  horizon: ${agents.horizon}
  yaw_cols: ${agents.yaw_cols}
  drop_cols: ${agents.drop_cols}
  aligning_rel: ${agents.aligning_rel}
  cond_dim: 256
  obs_hidden: 512
  energy_hidden: 256
  energy_blocks: 3
  energy_kernel: 3

trainset: ${trainset}
valset: ${valset}
train_batch_size: 512
val_batch_size: ${val_batch_size}
num_workers: ${num_workers}
epoch: ${epoch}                 # 未使用 (step 数で学習する)
device: ${device}
scale_data: ${scale_data}
eval_every_n_epochs: ${eval_every_n_epochs}

# 観測履歴 To / 予測チャンク H / 実行長 Ta
obs_history: 2
horizon: 16
exec_horizon: 8
# tan(yaw) 列を sin4θ/cos4θ に置き換える列番号。[] なら D3IL の観測をそのまま使う。
# Sorting4 (obs_dim 16) の向き列は [6, 9, 12, 15]
yaw_cols: []
# 生の観測から落とす列番号 (yaw_cols と併用不可)。Aligning のノイズ列: [8, 10, 11, 15, 17, 18]
drop_cols: []
# Aligning 用の相対特徴 6 次元を追加
aligning_rel: False

lr: 3.0e-4
betas: [0.9, 0.95]
weight_decay: 1.0e-4
warmup_steps: 2000
min_lr: 1.0e-6
grad_clip: 1.0

flow_steps: 100000
ema_decay: 0.999               # 窓 1k step << 学習 step 数 (Square の EMA 崩壊の教訓)
t_dist: uniform

# sampler
num_steps: 20
tau_star: 0.8
sample_eps_max: 0.0
sample_T: 1.0                   # >1: t = 1 の先も積分する (sample_eps_max > 0 と併用)
n_action_samples: 1             # >1: K 本引いて V(x|c) 最小を実行 (best-of-K)

val_every: 5000
save_every: 20000
log_every: 1000

