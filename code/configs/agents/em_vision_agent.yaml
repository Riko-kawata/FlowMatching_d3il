_target_: agents.em_vision_agent.EMVisionAgent
_recursive_: false

model:
  _target_: agents.models.em.em_policy.EMVisionPolicy
  _recursive_: false
  action_dim: ${action_dim}
  obs_history: ${agents.obs_history}
  horizon: ${agents.horizon}
  frame_dim: 128                # 64 x 2 cams
  cond_dim: 256
  obs_hidden: 512
  energy_hidden: 256
  energy_blocks: 3
  energy_kernel: 3
  obs_encoder:                  # D3IL vision ベースラインと同一
    _target_: agents.models.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta:
      obs:
        agentview_image:
          shape: [3, 96, 96]
          type: rgb
        in_hand_image:
          shape: [3, 96, 96]
          type: rgb
    rgb_model:
      _target_: agents.models.vision.model_getter.get_resnet
      input_shape: [3, 96, 96]
      output_size: 64
    resize_shape: null
    random_crop: False
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

trainset: ${trainset}
valset: ${valset}
train_batch_size: 128
val_batch_size: ${val_batch_size}
num_workers: ${num_workers}
epoch: ${epoch}                 # 未使用 (step 数で学習する)
device: ${device}
scale_data: ${scale_data}
eval_every_n_epochs: ${eval_every_n_epochs}

# 観測履歴 To / 予測チャンク H / 実行長 Ta
obs_history: 2
horizon: 16
exec_horizon: 8
yaw_cols: []                    # 画像版では未使用

lr: 1.5e-4                     # robosuite_square (画像版) と同じ
betas: [0.9, 0.95]
weight_decay: 1.0e-4
warmup_steps: 2000
min_lr: 1.0e-6
grad_clip: 1.0

flow_steps: 60000
ema_decay: 0.999               # 窓 1k step << 学習 step 数 (Square の EMA 崩壊の教訓)
t_dist: uniform

# sampler
num_steps: 20
tau_star: 0.8
sample_eps_max: 0.0
sample_T: 1.0                   # >1: t = 1 の先も積分する (sample_eps_max > 0 と併用)
n_action_samples: 1             # >1: K 本引いて V(x|c) 最小を実行 (best-of-K)

val_every: 5000
save_every: 20000
log_every: 1000

